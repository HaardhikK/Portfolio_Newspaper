<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 880" role="img" aria-label="Arthantar workflow. A source sentence passes through coreference resolution. Unclear gender goes to a gender backup before knowledge graph generation. Graph failure goes to a basic graph backup. Both graph paths feed translation.">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L8,4 L1,7" fill="none" stroke="#1b1a17" stroke-width="1.2"/>
    </marker>
    <marker id="arrow-soft" markerWidth="10" markerHeight="10" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L8,4 L1,7" fill="none" stroke="#5b5447" stroke-width="1.1"/>
    </marker>
  </defs>

  <style>
    text { font-family: "Times New Roman", Times, Georgia, serif; }
    .box { fill: #f7f1e6; stroke: #1b1a17; stroke-width: 1.1; }
    .box-soft { fill: none; stroke: #5b5447; stroke-width: 1; stroke-dasharray: 4 3; }
    .term { fill: #efe7d5; stroke: #1b1a17; stroke-width: 1.1; }
    .rule { stroke: #c9bea8; stroke-width: 1; }
    .arrow { fill: none; stroke: #1b1a17; stroke-width: 1.25; marker-end: url(#arrow); }
    .arrow-soft { fill: none; stroke: #5b5447; stroke-width: 1.1; stroke-dasharray: 4 3; marker-end: url(#arrow-soft); }
    .eyebrow { font-size: 12px; letter-spacing: 1.4px; fill: #8a5a23; }
    .title { font-size: 14px; font-weight: 700; fill: #1b1a17; }
    .sub { font-size: 12px; font-weight: 600; fill: #2d2922; }
    .term-text { font-size: 14.5px; fill: #1b1a17; }
    .label { font-size: 11px; font-style: italic; fill: #5b5447; }
  </style>

  <rect class="term" x="124" y="18" width="182" height="42"/>
  <text class="term-text" x="215" y="44" text-anchor="middle">Start: source sentence</text>
  <path class="arrow" d="M215 60 L215 88"/>

  <rect class="box" x="85" y="92" width="260" height="112"/>
  <text class="eyebrow" x="103" y="121">STEP 1</text>
  <text class="title" x="103" y="145">CoreferenceResolution</text>
  <line class="rule" x1="103" y1="158" x2="327" y2="158"/>
  <text class="sub" x="103" y="179">FCoref model</text>
  <text class="sub" x="103" y="195">Identify pronouns and gender</text>

  <path class="arrow-soft" d="M162 204 C142 245 128 270 124 300"/>
  <text class="label" x="80" y="255">cannot identify</text>

  <rect class="box-soft" x="42" y="300" width="198" height="116"/>
  <text class="eyebrow" x="60" y="329">BACKUP</text>
  <text class="title" x="60" y="353">GenderBackup</text>
  <line class="rule" x1="60" y1="366" x2="222" y2="366"/>
  <text class="sub" x="60" y="384">Mixtral 8x7B predicts</text>
  <text class="sub" x="60" y="399">gender for entities</text>

  <path class="arrow" d="M268 204 C292 265 302 355 286 440"/>
  <text class="label" x="300" y="320">gender identified</text>

  <path class="arrow" d="M172 416 C190 430 204 441 215 448"/>
  <text class="label" x="105" y="435">gender found</text>

  <rect class="box" x="75" y="450" width="280" height="116"/>
  <text class="eyebrow" x="93" y="480">STEP 2</text>
  <text class="title" x="93" y="504">KnowledgeGraphGeneration</text>
  <line class="rule" x1="93" y1="517" x2="337" y2="517"/>
  <text class="sub" x="93" y="539">LLMGraphTransformer builds entities,</text>
  <text class="sub" x="93" y="555">relationships, and gender context</text>

  <path class="arrow-soft" d="M144 566 C116 600 96 620 86 645"/>
  <text class="label" x="92" y="609">if LLM graph fails</text>

  <rect class="box-soft" x="28" y="645" width="170" height="116"/>
  <text class="eyebrow" x="46" y="675">FALLBACK</text>
  <text class="title" x="46" y="699">BasicGraphBackup</text>
  <line class="rule" x1="46" y1="712" x2="180" y2="712"/>
  <text class="sub" x="46" y="730">spaCy entities</text>
  <text class="sub" x="46" y="746">NetworkX relations</text>

  <path class="arrow" d="M286 566 C326 611 334 654 308 680"/>
  <text class="label" x="305" y="628">pass graph</text>
  <path class="arrow" d="M198 706 C220 710 236 714 252 718"/>

  <rect class="box" x="252" y="680" width="144" height="90"/>
  <text class="eyebrow" x="270" y="710">STEP 3</text>
  <text class="title" x="270" y="734">Translation</text>
  <line class="rule" x1="270" y1="747" x2="378" y2="747"/>
  <text class="sub" x="270" y="763">Llama 3.1 8B</text>

  <path class="arrow" d="M324 770 L324 810"/>
  <rect class="term" x="224" y="814" width="200" height="42"/>
  <text class="term-text" x="324" y="840" text-anchor="middle">Gender-aware translation</text>
</svg>
